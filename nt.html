<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jūsų mylimas brokeris</title>
    <style>
        @font-face {
            font-family: 'Raleway';
            font-style: normal;
            font-weight: 400;
            src: url(https://fonts.gstatic.com/s/raleway/v17/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVvaorCIPrQ.ttf) format('truetype');
        }
        @font-face {
            font-family: 'Raleway';
            font-style: normal;
            font-weight: 700;
            src: url(https://fonts.gstatic.com/s/raleway/v17/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVs9pbCIPrQ.ttf) format('truetype');
        }
        .business-card {
            display: grid;
            overflow: hidden;
            position: relative;
            line-height: 1.6;
            font-size: 4.5vmin;
            width: 100vmin;
            height: 60vmin;
            padding: 4vmin;
            border-radius: 6px;
            box-shadow: 0 5px 15px -5px rgba(0, 0, 0, 0.4);
            margin: 1vmin;
        }
        .content {
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            font-family: 'Raleway', sans-serif;
            color: white;
        }
        .top {
            display: grid;
            grid-column: 0.33333333;
            grid-row: 1;
            align-content: start;
            grid-gap: 1.5vmin;
        }
        .name {
            font-size: 2em;
            font-weight: 700;
            line-height: 1;
        }
        .profession {
            color: white;
            text-transform: uppercase;
            font-size: 1em;
            font-weight: 700;
        }
        .bottom {
            display: grid;
            grid-column: 0.33333333;
            grid-row: 3;
            grid-template-columns: 1fr 1fr 1fr;
            align-content: end;
        }
        .bottom .left {
            font-weight: 700;
            font-size: 0.9em;
            grid-column: 1;
        }
        .bottom .right {
            grid-column: 3;
            align-self: end;
        }
        .website {
            color: white;
            font-weight: 400;
        }
        .location {
            white-space: nowrap;
            text-align: right;
            color: black;
            text-transform: uppercase;
            font-size: 0.7em;
        }
        .background {
            z-index: 1;
            background-color: #FFFFFF;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
        }
        .slice {
            top: -59vmin;
            left: -1vmin;
            position: absolute;
            width: 90vmin;
            height: 150vmin;
            background: gray;
            background: -webkit-linear-gradient(to right, gray, lightgrey);
            background: linear-gradient(to right, gray, lightgrey);
            transform: rotate(38deg);
        }
        @keyframes inRotate {
            0% {
                transform: translateX(-100vmin) rotate(15deg);
            }
            100% {
                transform: translateX(0) rotate(38deg);
            }
        }
        @keyframes inLeft {
            0% {
                transform: translateX(-100vmin);
            }
            100% {
                transform: translateX(0);
            }
        }
        @keyframes inRight {
            0% {
                transform: translateX(100vmin);
            }
            100% {
                transform: translateX(0);
            }
        }
        html {
            height: 100%;
        }
        body {
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 0;
        }
    </style>
    <script>
        const defaultValues = {
            "name": "Apipi & Shaw",
            "profession": "Real Estate & Finance",
            "email": "brokeris@apipishaw.com",
            "phone": "+370 5 2062090",
            "website": "re.apipishaw.com",
            "location": "New Wileyka<br/>Wilno, Litwa"
        }

        function getQueryString() {
            const search = location.search.substring(1);
            if (!search) return null;
            const uri = decodeURI(search)
                .replace(/"/g, '\\"')
                .replace(/&/g, '","')
                .replace(/=/g, '":"')

            return JSON.parse(`{"${uri}"}`);
        }

        function updateData(data) {
            Object.keys(data).forEach(key => {
                document.getElementById(key).innerHTML = data[key]
            })
        }

        window.onload = () => {
            const qs = getQueryString()
            if (!qs) {
                console.warn('queryString not found using default values...')
            }
            const getLength = obj => Object.keys(obj).length
            const isMissingKeysOnQueryString = getLength(defaultValues) === getLength(qs || {})
            if (!isMissingKeysOnQueryString) {
                console.warn(`All missing parameters will come from default values\nRequired parameters are`, Object.keys(defaultValues))
            }


            updateData({
                ...defaultValues,
                ...qs,
            })

        }
    </script>
</head>
<body>
<div class="business-card">
    <div class="content">
        <div class="top">
            <div id="name" class="name"></div>
            <div id="profession" class="profession"></div>
        </div>
        <div class="bottom">
            <div class="left">
                <div id="email" class="email"></div>
                <div id="phone" class="phone"></div>
                <div id="website" class="website"></div>
            </div>
            <div class="right">
                <div id="location" class="location"></div>
            </div>
        </div>
    </div>
    <div class="background">
        <div class="slice"></div>
    </div>
</div>
<footer>
</footer>
</body>
</html>
